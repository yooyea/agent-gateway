name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agent_gateway_test
          POSTGRES_USER: agent_gateway
          POSTGRES_PASSWORD: agent_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_gateway -d agent_gateway_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://agent_gateway:agent_gateway_test@localhost:5432/agent_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
